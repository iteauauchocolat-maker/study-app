// 印刷用の出題プール (対象を絞り、順番は維持)
function collectPrintPool(cfg) {
  let pool = state.questions.filter(q => isUnitForProfile(getUnit(q.unitId)));
  if (cfg.subjectId !== 'all') {
    pool = pool.filter(q => {
      const u = getUnit(q.unitId);
      return u && u.subjectId === cfg.subjectId;
    });
  }
  if (cfg.unitId && cfg.unitId !== 'all') {
    pool = pool.filter(q => q.unitId === cfg.unitId);
  }
  return pool;
}

// プレビュー: 1ページ目相当の内容を画面で表示
function buildPreviewHtml(items, cfg) {
  if (items.length === 0) return '<div style="color:#666">出題できる問題がありません</div>';
  const title = printTitle(cfg);
  const dir = cfg.direction || 'kakitori';
  const dirLabel = dir === 'yomi' ? 'よみ' : '書き取り';
  const isKanjiPool = items.every(q => q.type === 'kanji');
  if (isKanjiPool) {
    // 漢字は簡易リストでプレビュー (実際の印刷は縦書きグリッド)
    const list = items.map(q => {
      const d = questionDisplay(q, dir);
      const ans = cfg.output === 'with-answer' || cfg.output === 'answer-only'
        ? `<span class="answer-text">[${escapeHtml(d.answers.join(' / '))}]</span>`
        : '<span class="answer-line"></span>';
      return `<li>${escapeHtml(d.text)} ${ans}</li>`;
    }).join('');
    return `<h2>${escapeHtml(title)} ${dirLabel}</h2>
      <div class="meta"><span>${escapeHtml(title)} (${dirLabel})</span><span>名前:_______________</span></div>
      <div style="font-size:11px;color:#666;margin-bottom:8px">※ 印刷時は学校の書き取りプリント風に縦書きグリッドで出力されます</div>
      <ol>${list}</ol>`;
  }
  if (cfg.output === 'answer-only') {
    return `<h2>${escapeHtml(title)} 解答</h2>
      <div class="meta"><span>${escapeHtml(title)}</span><span>名前:_______________</span></div>
      <ol>` +
      items.map(q => {
        const d = questionDisplay(q, dir);
        return `<li><span class="answer-text">${escapeHtml(d.answers.join(' / '))}</span></li>`;
      }).join('') +
      '</ol>';
  }
  return `<h2>${escapeHtml(title)}</h2>
    <div class="meta"><span>${escapeHtml(title)}</span><span>名前:_______________</span></div>
    <ol>` +
    items.map(q => {
      const d = questionDisplay(q, dir);
      const ans = cfg.output === 'with-answer'
        ? `<span class="answer-text">[${escapeHtml(d.answers.join(' / '))}]</span>`
        : '<span class="answer-line"></span>';
      return `<li>${escapeHtml(d.text)} ${ans}</li>`;
    }).join('') +
    '</ol>';
}

// 実印刷HTML: 漢字は縦書きグリッド、それ以外はリスト
function buildPrintHtml(items, cfg) {
  if (items.length === 0) return '';
  const isKanjiPool = items.every(q => q.type === 'kanji');
  if (isKanjiPool) return buildKanjiPrintHtml(items, cfg);
  return buildListPrintHtml(items, cfg);
}

function buildKanjiPrintHtml(items, cfg) {
  const dir = cfg.direction || 'kakitori';
  const dirLabel = dir === 'yomi' ? 'よみ' : '書き取り';
  const perPage = cfg.perPage || 20;
  const lay = PRINT_LAYOUTS[perPage] || { cols: 4, rows: Math.ceil(perPage / 4) };
  const totalPages = Math.max(1, Math.ceil(items.length / perPage));
  const pages = [];
  for (let i = 0; i < items.length; i += perPage) pages.push(items.slice(i, i + perPage));

  const title = printTitle(cfg);
  return pages.map((pageItems, pageIdx) => {
    const cells = pageItems.map(q => {
      const d = questionDisplay(q, dir);
      const r = getLatestResult(q.id, dir);
      const markCh = r === 'o' ? '○' : (r === 'd' ? '△' : (r === 'x' ? '×' : ''));
      const mark = r ? `<span class="kp-mark ${r}">${markCh}</span>` : '';
      // 問題側 (向きにより漢字か読み)
      const qClass = (dir === 'yomi') ? 'kp-q kp-q-large' : 'kp-q';
      const qHtml = `<div class="${qClass}">${escapeHtml(d.text)}</div>`;
      // 解答側
      let aHtml;
      if (cfg.output === 'with-answer' || cfg.output === 'answer-only') {
        const ansText = (d.answers && d.answers[0]) || '';
        const aCls = (dir === 'yomi') ? 'kp-a kp-a-shown kp-a-yomi' : 'kp-a kp-a-shown';
        aHtml = `<div class="${aCls}">${escapeHtml(ansText)}</div>`;
      } else {
        aHtml = '<div class="kp-a"></div>';
      }
      return `<div class="kp-cell">${mark}${qHtml}${aHtml}</div>`;
    }).join('');
    // 余り枠 (空セル) でグリッドを埋める
    const fillerCount = perPage - pageItems.length;
    const fillers = fillerCount > 0
      ? Array(fillerCount).fill('<div class="kp-cell kp-cell-empty"></div>').join('')
      : '';
    return `<div class="kp-page">
      <div class="kp-header">
        <span class="kp-title">${escapeHtml(title)} (${dirLabel})</span>
        <span>名前:______________</span>
        <span>${pageIdx + 1} / ${totalPages}</span>
      </div>
      <div class="kp-grid cols-${lay.cols} rows-${lay.rows}">${cells}${fillers}</div>
    </div>`;
  }).join('');
}

function buildListPrintHtml(items, cfg) {
  const dir = cfg.direction || 'kakitori';
  const perPage = cfg.perPage || 20;
  const totalPages = Math.max(1, Math.ceil(items.length / perPage));
  const pages = [];
  for (let i = 0; i < items.length; i += perPage) pages.push(items.slice(i, i + perPage));
  const title = printTitle(cfg);
  return pages.map((pageItems, pageIdx) => {
    const startNum = pageIdx * perPage + 1;
    const pageHeader = `<h2>${escapeHtml(title)}${cfg.output === 'answer-only' ? ' 解答' : ''} (${pageIdx + 1}/${totalPages})</h2>
      <div class="meta"><span>${escapeHtml(title)}</span><span>名前:______________</span></div>`;
    if (cfg.output === 'answer-only') {
      const lis = pageItems.map((q, i) => {
        const d = questionDisplay(q, dir);
        return `<li value="${startNum + i}"><span class="answer-text">${escapeHtml(d.answers.join(' / '))}</span></li>`;
      }).join('');
      return `<div class="print-page">${pageHeader}<ol start="${startNum}">${lis}</ol></div>`;
    }
    const lis = pageItems.map((q, i) => {
      const d = questionDisplay(q, dir);
      const ans = cfg.output === 'with-answer'
        ? `<span class="answer-text">[${escapeHtml(d.answers.join(' / '))}]</span>`
        : '<span class="answer-line"></span>';
      return `<li value="${startNum + i}">${escapeHtml(d.text)} ${ans}</li>`;
    }).join('');
    return `<div class="print-page">${pageHeader}<ol start="${startNum}">${lis}</ol></div>`;
  }).join('');
}

function printTitle(cfg) {
  const parts = [];
  if (cfg.subjectId === 'all') parts.push('全教科');
  else {
    const s = getSubject(cfg.subjectId);
    if (s) parts.push(s.name);
    if (cfg.unitId !== 'all') {
      const u = getUnit(cfg.unitId);
      if (u) parts.push(u.name);
    }
  }
  return parts.join(' ');
}

// 用紙サイズを @page CSSに動的注入
function setPrintPaperSize(paper) {
  let style = document.getElementById('print-paper-style');
  if (!style) {
    style = document.createElement('style');
    style.id = 'print-paper-style';
    document.head.appendChild(style);
  }
  style.textContent = `@media print { @page { size: ${paper}; margin: 12mm; } }`;
}

let qmFilter = { subjectId: 'all', unitId: 'all' };

function renderQuestionMgmt() {
  const subjectOpts = ['<option value="all">すべての教科</option>']
    .concat(state.subjects.map(s => `<option value="${s.id}" ${qmFilter.subjectId === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`))
    .join('');
  let unitOpts = '<option value="all">すべての単元</option>';
  if (qmFilter.subjectId !== 'all') {
    unitOpts += state.units
      .filter(u => u.subjectId === qmFilter.subjectId)
      .map(u => `<option value="${u.id}" ${qmFilter.unitId === u.id ? 'selected' : ''}>${escapeHtml(u.name)}</option>`)
      .join('');
  }

  // フィルタ適用
  let qs = state.questions.slice();
  if (qmFilter.subjectId !== 'all') {
    qs = qs.filter(q => {
      const u = getUnit(q.unitId);
      return u && u.subjectId === qmFilter.subjectId;
    });
  }
  if (qmFilter.unitId !== 'all') {
    qs = qs.filter(q => q.unitId === qmFilter.unitId);
  }

  const itemsHtml = qs.length === 0
    ? '<div class="card" style="text-align:center;color:var(--text-secondary)">問題がありません</div>'
    : qs.map(q => {
        const unit = getUnit(q.unitId);
        const subj = unit ? getSubject(unit.subjectId) : null;
        const tag = (subj ? subj.name : '?') + ' / ' + (unit ? unit.name : '?');
        let qText, aText;
        if (q.type === 'kanji') {
          qText = q.yomi || ''; aText = q.kanji || '';
        } else if (q.type === 'english') {
          qText = q.ja || ''; aText = q.en || '';
        } else if (q.type === 'hyakunin') {
          qText = (q.no ? q.no + '. ' : '') + (q.kami || ''); aText = (q.shimo || '') + ' — ' + (q.author || '');
        } else {
          qText = q.question || ''; aText = (q.answers || []).join(' / ');
        }
        return `
          <div class="qm-item">
            <div class="qm-item-meta">${escapeHtml(tag)}</div>
            <div class="qm-item-q">${escapeHtml(qText)}</div>
            <div class="qm-item-a">→ ${escapeHtml(aText)}</div>
            <div class="qm-item-actions">
              <button class="btn small secondary" data-act="edit" data-id="${q.id}">編集</button>
              <button class="btn small danger" data-act="delete" data-id="${q.id}">削除</button>
            </div>
          </div>`;
      }).join('');

  document.getElementById('screen-question-mgmt').innerHTML = `
    <div class="nav-bar">
      <button class="nav-button" id="qm-back">‹ 戻る</button>
      <span class="nav-title">問題管理</span>
      <button class="nav-button" id="qm-subject-mgmt">教科</button>
    </div>
    <div class="content">
      <div class="filter-row">
        <select class="select" id="qm-f-sub">${subjectOpts}</select>
        <select class="select" id="qm-f-unit" ${qmFilter.subjectId === 'all' ? 'disabled' : ''}>${unitOpts}</select>
      </div>
      <button class="btn" id="qm-add">＋ 問題を追加</button>
      <div class="section-label">${qs.length}件</div>
      ${itemsHtml}
    </div>`;

  document.getElementById('qm-back').onclick = () => {
    if (currentProfileId) goBack();
    else showScreen('profile-select', {}, true);
  };
  document.getElementById('qm-subject-mgmt').onclick = () => showScreen('subject-mgmt');
  document.getElementById('qm-f-sub').onchange = e => {
    qmFilter.subjectId = e.target.value;
    qmFilter.unitId = 'all';
    renderQuestionMgmt();
  };
  document.getElementById('qm-f-unit').onchange = e => {
    qmFilter.unitId = e.target.value;
    renderQuestionMgmt();
  };
  document.getElementById('qm-add').onclick = () => {
    const initialUnit = (qmFilter.unitId !== 'all') ? qmFilter.unitId : null;
    showScreen('question-edit', { questionId: null, unitId: initialUnit });
  };
  document.querySelectorAll('#screen-question-mgmt [data-act="edit"]').forEach(b => {
    b.onclick = () => showScreen('question-edit', { questionId: b.dataset.id });
  });
  document.querySelectorAll('#screen-question-mgmt [data-act="delete"]').forEach(b => {
    b.onclick = async () => {
      const ok = await showConfirm('問題を削除', 'この問題を削除しますか? (履歴も一緒に削除されます)', { okText: '削除', danger: true });
      if (!ok) return;
      const id = b.dataset.id;
      state.questions = state.questions.filter(q => q.id !== id);
      // 履歴も対応するものを削除
      Object.keys(state.history).forEach(pid => {
        state.history[pid] = state.history[pid].filter(h => h.questionId !== id);
      });
      saveState();
      showToast('削除しました');
      renderQuestionMgmt();
    };
  });
}

/* ------------------------------------------------------------
   画面: 問題編集 (新規/編集兼用)
   ------------------------------------------------------------ */
function renderQuestionEdit(questionId, defaultUnitId) {
  const isNew = !questionId;
  const q = isNew
    ? { id: null, unitId: defaultUnitId || (state.units[0] && state.units[0].id), type: 'qa', question: '', answers: [''], hint: '', sourceNote: '' }
    : Object.assign({}, getQuestion(questionId));
  if (!q) { goBack(); return; }
  if (q.type !== 'kanji' && q.type !== 'english' && q.type !== 'hyakunin' && (!q.answers || q.answers.length === 0)) q.answers = [''];
  const isKanji = q.type === 'kanji';
  const isEnglish = q.type === 'english';
  const isHyakunin = q.type === 'hyakunin';

  // 単元プルダウンを教科ごとにグループ化
  const unitOptionsHtml = state.subjects.map(s => {
    const us = state.units.filter(u => u.subjectId === s.id);
    if (us.length === 0) return '';
    return `<optgroup label="${escapeHtml(s.name)}">` +
      us.map(u => `<option value="${u.id}" ${q.unitId === u.id ? 'selected' : ''}>${escapeHtml(u.name)}</option>`).join('') +
      `</optgroup>`;
  }).join('');

  let fieldsHtml;
  if (isKanji) {
    fieldsHtml = `
      <div class="field">
        <div class="field-label">漢字</div>
        <input class="input" id="qe-kanji" placeholder="例: 宗教" value="${escapeHtml(q.kanji || '')}">
      </div>
      <div class="field">
        <div class="field-label">よみ (ひらがな)</div>
        <input class="input" id="qe-yomi" placeholder="例: しゅうきょう" value="${escapeHtml(q.yomi || '')}">
      </div>`;
  } else if (isEnglish) {
    fieldsHtml = `
      <div class="field">
        <div class="field-label">英語</div>
        <input class="input" id="qe-en" placeholder="例: building" value="${escapeHtml(q.en || '')}">
      </div>
      <div class="field">
        <div class="field-label">日本語</div>
        <input class="input" id="qe-ja" placeholder="例: 建物" value="${escapeHtml(q.ja || '')}">
      </div>`;
  } else if (isHyakunin) {
    fieldsHtml = `
      <div class="field">
        <div class="field-label">上の句</div>
        <textarea class="textarea" id="qe-kami">${escapeHtml(q.kami || '')}</textarea>
      </div>
      <div class="field">
        <div class="field-label">下の句</div>
        <textarea class="textarea" id="qe-shimo">${escapeHtml(q.shimo || '')}</textarea>
      </div>
      <div class="field">
        <div class="field-label">意味 (現代語訳)</div>
        <textarea class="textarea" id="qe-meaning">${escapeHtml(q.meaning || '')}</textarea>
      </div>
      <div class="field">
        <div class="field-label">詠み手 (作者)</div>
        <input class="input" id="qe-author" value="${escapeHtml(q.author || '')}">
      </div>
      <div class="field">
        <div class="field-label">主な表現技法</div>
        <input class="input" id="qe-technique" value="${escapeHtml(q.technique || '')}">
      </div>`;
  } else {
    fieldsHtml = `
      <div class="field">
        <div class="field-label">問題文</div>
        <textarea class="textarea" id="qe-q" placeholder="例: 江戸幕府を開いた人物は?">${escapeHtml(q.question || '')}</textarea>
      </div>
      <div class="field">
        <div class="field-label">解答 (将来的に複数登録可能)</div>
        <input class="input" id="qe-a" placeholder="例: 徳川家康" value="${escapeHtml((q.answers || [''])[0])}">
      </div>`;
  }

  document.getElementById('screen-question-edit').innerHTML = `
    <div class="nav-bar">
      <button class="nav-button" id="qe-cancel">キャンセル</button>
      <span class="nav-title">${isNew ? '問題を追加' : '問題を編集'}</span>
      <button class="nav-button" id="qe-save"><b>保存</b></button>
    </div>
    <div class="content">
      <div class="field">
        <div class="field-label">単元</div>
        <select class="select" id="qe-unit">${unitOptionsHtml}</select>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">単元がない場合は「教科」から追加してください</div>
      </div>
      ${fieldsHtml}
      <div class="field">
        <div class="field-label">ヒント (任意)</div>
        <input class="input" id="qe-hint" value="${escapeHtml(q.hint || '')}">
      </div>
      <div class="field">
        <div class="field-label">出典メモ (任意)</div>
        <input class="input" id="qe-src" placeholder="例: 教科書p.34" value="${escapeHtml(q.sourceNote || '')}">
      </div>
      ${!isNew ? '<button class="btn danger" id="qe-delete">この問題を削除</button>' : ''}
    </div>`;

  document.getElementById('qe-cancel').onclick = goBack;
  document.getElementById('qe-save').onclick = () => {
    const unitId = document.getElementById('qe-unit').value;
    const hint = document.getElementById('qe-hint').value.trim();
    const src = document.getElementById('qe-src').value.trim();
    if (!unitId) { showAlert('単元を選んでください'); return; }
    let question, answer, kanji, yomi, en, ja, kami, shimo, meaning, author, technique;
    if (isKanji) {
      kanji = document.getElementById('qe-kanji').value.trim();
      yomi = document.getElementById('qe-yomi').value.trim();
      if (!kanji) { showAlert('漢字を入力してください'); return; }
      if (!yomi) { showAlert('よみを入力してください'); return; }
    } else if (isEnglish) {
      en = document.getElementById('qe-en').value.trim();
      ja = document.getElementById('qe-ja').value.trim();
      if (!en) { showAlert('英語を入力してください'); return; }
      if (!ja) { showAlert('日本語を入力してください'); return; }
    } else if (isHyakunin) {
      kami = document.getElementById('qe-kami').value.trim();
      shimo = document.getElementById('qe-shimo').value.trim();
      meaning = document.getElementById('qe-meaning').value.trim();
      author = document.getElementById('qe-author').value.trim();
      technique = document.getElementById('qe-technique').value.trim();
      if (!kami) { showAlert('上の句を入力してください'); return; }
      if (!shimo) { showAlert('下の句を入力してください'); return; }
    } else {
      question = document.getElementById('qe-q').value.trim();
      answer = document.getElementById('qe-a').value.trim();
      if (!question) { showAlert('問題文を入力してください'); return; }
      if (!answer) { showAlert('解答を入力してください'); return; }
    }

    if (isNew) {
      state.questions.push({
        id: genId('q'),
        unitId,
        type: 'qa',
        question,
        answers: [answer],
        hint, sourceNote: src,
        createdAt: todayStr()
      });
    } else {
      const target = getQuestion(q.id);
      target.unitId = unitId;
      target.hint = hint;
      target.sourceNote = src;
      if (isKanji) {
        target.kanji = kanji;
        target.yomi = yomi;
      } else if (isEnglish) {
        target.en = en;
        target.ja = ja;
      } else if (isHyakunin) {
        target.kami = kami;
        target.shimo = shimo;
        target.meaning = meaning;
        target.author = author;
        target.technique = technique;
      } else {
        target.question = question;
        target.answers = [answer];
      }
    }
    saveState();
    showToast(isNew ? '追加しました' : '保存しました');
    goBack();
  };
  if (!isNew) {
    document.getElementById('qe-delete').onclick = async () => {
      const ok = await showConfirm('問題を削除', 'この問題を削除しますか?', { okText: '削除', danger: true });
      if (!ok) return;
      state.questions = state.questions.filter(x => x.id !== q.id);
      Object.keys(state.history).forEach(pid => {
        state.history[pid] = state.history[pid].filter(h => h.questionId !== q.id);
      });
      saveState();
      showToast('削除しました');
      goBack();
    };
  }
}

    return `
      <div class="section-label">${escapeHtml(s.name)}
        <button class="btn small" data-sact="rename-sub" data-id="${s.id}" style="margin-left:8px">名称</button>
        <button class="btn small danger" data-sact="del-sub" data-id="${s.id}" style="margin-left:4px">削除</button>
      </div>
      <div class="list-group">
        ${unitsHtml}
        <button class="list-item" data-sact="add-unit" data-id="${s.id}">
          <div class="list-item-main"><div class="list-item-title" style="color:var(--primary)">＋ 単元を追加</div></div>
        </button>
      </div>`;
  }).join('');

  document.getElementById('screen-subject-mgmt').innerHTML = `
    <div class="nav-bar">
      <button class="nav-button" id="sm-back">‹ 戻る</button>
      <span class="nav-title">教科・単元の管理</span>
      <span class="nav-spacer"></span>
    </div>
    <div class="content">
      <button class="btn" id="sm-add-sub">＋ 教科を追加</button>
      ${subjectsHtml}
    </div>`;

  document.getElementById('sm-back').onclick = goBack;
  document.getElementById('sm-add-sub').onclick = () => {
    const name = prompt('教科名を入力してください');
    if (!name) return;
    state.subjects.push({ id: genId('sub'), name: name.trim() });
    saveState();
    showToast('教科を追加しました');
    renderSubjectMgmt();
  };
  document.querySelectorAll('#screen-subject-mgmt [data-sact]').forEach(b => {
    b.onclick = async () => {
      const act = b.dataset.sact;
      const id = b.dataset.id;
      if (act === 'rename-sub') {
        const sub = getSubject(id);
        const name = prompt('教科名', sub.name);
        if (name) { sub.name = name.trim(); saveState(); renderSubjectMgmt(); }
      } else if (act === 'del-sub') {
        const sub = getSubject(id);
        const unitIds = state.units.filter(u => u.subjectId === id).map(u => u.id);
        const qids = state.questions.filter(q => unitIds.includes(q.unitId)).map(q => q.id);
        const ok = await showConfirm('教科を削除',
          `「${sub.name}」と配下の単元 ${unitIds.length}件・問題 ${qids.length}件 をすべて削除します。よろしいですか?`,
          { okText: '削除', danger: true });
        if (!ok) return;
        state.subjects = state.subjects.filter(s => s.id !== id);
        state.units = state.units.filter(u => u.subjectId !== id);
        state.questions = state.questions.filter(q => !qids.includes(q.id));
        Object.keys(state.history).forEach(pid => {
          state.history[pid] = state.history[pid].filter(h => !qids.includes(h.questionId));
        });
        saveState();
        showToast('削除しました');
        renderSubjectMgmt();
      } else if (act === 'add-unit') {
        const name = prompt('単元名を入力してください');
        if (!name) return;
        state.units.push({ id: genId('u'), subjectId: id, name: name.trim(), parentId: null });
        saveState();
        showToast('単元を追加しました');
        renderSubjectMgmt();
      }
    };
  });
  document.querySelectorAll('#screen-subject-mgmt [data-uact]').forEach(b => {
    b.onclick = async () => {
      const act = b.dataset.uact;
      const id = b.dataset.id;
      if (act === 'rename') {
        const u = getUnit(id);
        const name = prompt('単元名', u.name);
        if (name) { u.name = name.trim(); saveState(); renderSubjectMgmt(); }
      } else if (act === 'delete') {
        const u = getUnit(id);
        const qids = state.questions.filter(q => q.unitId === id).map(q => q.id);
        const ok = await showConfirm('単元を削除',
          `「${u.name}」と配下の問題 ${qids.length}件 を削除します。よろしいですか?`,
          { okText: '削除', danger: true });
        if (!ok) return;
        state.units = state.units.filter(x => x.id !== id);
        state.questions = state.questions.filter(q => q.unitId !== id);
        Object.keys(state.history).forEach(pid => {
          state.history[pid] = state.history[pid].filter(h => !qids.includes(h.questionId));
        });
        saveState();
        showToast('削除しました');
        renderSubjectMgmt();
      }
    };
  });
}

/* ------------------------------------------------------------
   画面: データ管理
   ------------------------------------------------------------ */
function renderDataMgmt() {
  // 統計
  const totalQ = state.questions.length;
  const totalSub = state.subjects.length;
  const totalUnit = state.units.length;
  const histStats = state.profiles.map(p => {
    const h = state.history[p.id] || [];
    return `${p.name}: ${h.length}件`;
  }).join(' / ');

  document.getElementById('screen-data-mgmt').innerHTML = `
    <div class="nav-bar">
      <button class="nav-button" id="dm-back">‹ 戻る</button>
      <span class="nav-title">データ管理</span>
      <span class="nav-spacer"></span>
    </div>
    <div class="content">
      <div class="card">
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px">現在のデータ</div>
        <div>教科 ${totalSub} / 単元 ${totalUnit} / 問題 ${totalQ}</div>
        <div style="font-size:13px;color:var(--text-secondary);margin-top:4px">学習履歴 - ${histStats}</div>
      </div>
      <button class="btn" id="dm-export">⬇ JSONをエクスポート</button>
      <button class="btn secondary" id="dm-import">⬆ JSONをインポート</button>
      <input type="file" id="dm-file" accept="application/json,.json" style="display:none">
      <div style="height:24px"></div>
      <button class="btn danger" id="dm-reset">⚠ 全データをリセット</button>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:8px;text-align:center">リセットするとサンプルデータに戻ります</div>
    </div>`;

  document.getElementById('dm-back').onclick = goBack;
  document.getElementById('dm-export').onclick = doExport;
  document.getElementById('dm-import').onclick = () => document.getElementById('dm-file').click();
  document.getElementById('dm-file').onchange = doImport;
  document.getElementById('dm-reset').onclick = doReset;
}

function doExport() {
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `study-app-data-${todayCompact()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('エクスポートしました');
}

async function doImport(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const imported = JSON.parse(text);
    if (!imported || !imported.subjects || !imported.units || !imported.questions) {
      throw new Error('データ形式が正しくありません');
    }
    const choice = await showConfirm('インポート方法',
      '「OK」で現在のデータを置き換え、「キャンセル」で操作をやめます。\n\n※ マージはしません (置き換えのみ)',
      { okText: '置き換え', danger: true });
    if (!choice) {
      e.target.value = '';
      return;
    }
    state = imported;
    if (!state.history) state.history = {};
    state.profiles.forEach(p => {
      if (!state.history[p.id]) state.history[p.id] = [];
    });
    saveState();
    showToast('インポートしました');
    // ホームへ
    currentProfileId = null;
    navStack = [];
    showScreen('profile-select', {}, true);
  } catch (err) {
    showAlert('インポート失敗', String(err.message || err));
  }
  e.target.value = '';
}

async function doReset() {
  const ok = await showConfirm('全データをリセット',
    '本当にすべてのデータ (問題・単元・履歴) を削除し、サンプルデータに戻しますか?\nこの操作は取り消せません。',
    { okText: 'リセット', danger: true });
  if (!ok) return;
  // 念のためダブルチェック
  const ok2 = await showConfirm('最終確認', '本当によろしいですか?', { okText: '実行', danger: true });
  if (!ok2) return;
  state = buildSampleData();
  saveState();
  currentProfileId = null;
  navStack = [];
  showToast('リセットしました');
  showScreen('profile-select', {}, true);
}

/* ------------------------------------------------------------
   起動
   ------------------------------------------------------------ */
loadState();
showScreen('profile-select', {}, true);
// 印刷後はプリントエリアをクリア (空にしておかないと次の印刷で前のが残る)
window.addEventListener('afterprint', () => {
  document.getElementById('print-area').innerHTML = '';
});

</script>
