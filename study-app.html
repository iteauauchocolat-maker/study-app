/* ④上の句→下の句 / ⑤下の句→上の句: 上の句=上・下の句=中央・詠み手=下 の空間配置 */
function startHyakuninGraded({ unitId = null, unitIds = null, subjectId = null, direction, reviewMode = false, order = 'random' }) {
  let pool = state.questions.filter(q => q.type === 'hyakunin' && isUnitForProfile(getUnit(q.unitId)));
  if (unitIds && unitIds.length) pool = pool.filter(q => unitIds.includes(q.unitId));
  else if (unitId) pool = pool.filter(q => q.unitId === unitId);
  if (subjectId) pool = pool.filter(q => {
    const u = getUnit(q.unitId);
    return u && u.subjectId === subjectId;
  });
  if (reviewMode) {
    pool = pool.filter(q => getLatestResult(q.id, direction, currentProfileId) !== 'o');
  }
  if (pool.length === 0) {
    showAlert('問題がありません', reviewMode
      ? 'この範囲には「○以外」の問題がありません。'
      : 'この範囲には百人一首がありません。');
    return;
  }
  const ordered = (order === 'seq')
    ? pool.slice().sort((a, b) => (a.no || 0) - (b.no || 0))
    : shuffle(pool).slice(0, Math.min(SESSION_DEFAULT_SIZE, pool.length));
  studySession = {
    unitId, unitIds, subjectId, direction, reviewMode, order,
    mode: 'hk-graded',
    questions: ordered,
    index: 0,
    revealed: false,
    results: [],
    startedAt: Date.now()
  };
  showScreen('hyakunin-test');
}

function renderHyakuninTest() {
  const s = studySession;
  if (!s) { goBack(); return; }
  if (s.index >= s.questions.length) { showScreen('result', {}, true); return; }
  const q = s.questions[s.index];
  const isKS = s.direction === 'hk-kami-shimo'; // ④: 上の句が問題
  const progress = (s.index / s.questions.length) * 100;
  // ④では上の句が問題(常時表示)、⑤では下の句が問題(常時表示)
  const kamiShown = s.revealed || isKS;
  const shimoShown = s.revealed || !isKS;
  const authorShown = s.revealed;
  const zone = (label, text, shown, isQ) =>
    `<div class="hk-zone ${isQ ? 'hk-zone-q' : ''} ${shown ? '' : 'hk-zone-hidden'}">
       <div class="hk-zone-label">${label}${isQ ? '（問題）' : ''}</div>
       <div class="hk-zone-text">${shown ? escapeHtml(text) : '<span class="hk-zone-mask">？</span>'}</div>
     </div>`;
  const actions = s.revealed
    ? `<div class="judge-buttons">
        <button class="judge-button x" data-r="x"><span class="judge-symbol">×</span><span class="judge-label">できなかった</span></button>
        <button class="judge-button d" data-r="d"><span class="judge-symbol">△</span><span class="judge-label">あやふや</span></button>
        <button class="judge-button o" data-r="o"><span class="judge-symbol">○</span><span class="judge-label">できた</span></button>
      </div>`
    : `<button class="btn" id="ht-show">答えを見る</button>`;

  document.getElementById('screen-hyakunin-test').innerHTML = `
    <div class="nav-bar">
      <button class="nav-button" id="ht-quit">中断</button>
      <span class="nav-title">${isKS ? '上の句→下の句' : '下の句→上の句'}</span>
      <span class="nav-spacer"></span>
    </div>
    <div class="study-header">
      <div class="study-progress">${s.index + 1} / ${s.questions.length}　（第${q.no}首）</div>
      <div class="study-progress-bar"><div class="study-progress-fill" style="width:${progress}%"></div></div>
    </div>
    <div class="content hk-test-body">
      ${zone('上の句', q.kami || '', kamiShown, isKS)}
      ${zone('下の句', q.shimo || '', shimoShown, !isKS)}
      ${zone('詠み手', q.author || '', authorShown, false)}
    </div>
    <div class="study-actions" id="ht-actions">${actions}</div>`;

  document.getElementById('ht-quit').onclick = async () => {
    const ok = await showConfirm('学習を中断', 'これまでの結果は記録されています。中断しますか?', { okText: '中断', danger: true });
    if (ok) { studySession = null; goBack(); }
  };
  if (!s.revealed) {
    document.getElementById('ht-show').onclick = () => { s.revealed = true; renderHyakuninTest(); };
  } else {
    document.querySelectorAll('#ht-actions .judge-button').forEach(b => {
      b.onclick = () => {
        const r = b.dataset.r;
        s.results.push({ questionId: q.id, result: r });
        state.history[currentProfileId].push({
          questionId: q.id,
          profileId: currentProfileId,
          result: r,
          direction: s.direction,
          answeredAt: new Date().toISOString()
        });
        saveState();
        s.index++;
        s.revealed = false;
        renderHyakuninTest();
      };
    });
  }
}

function startHyakuninQuiz({ unitId = null, unitIds = null, subjectId = null, mode, order = 'random' }) {
  let pool = state.questions.filter(q => q.type === 'hyakunin' && isUnitForProfile(getUnit(q.unitId)));
  if (unitIds && unitIds.length) pool = pool.filter(q => unitIds.includes(q.unitId));
  else if (unitId) pool = pool.filter(q => q.unitId === unitId);
  if (subjectId) pool = pool.filter(q => {
    const u = getUnit(q.unitId);
    return u && u.subjectId === subjectId;
  });
  if (pool.length === 0) {
    showAlert('問題がありません', 'この範囲には百人一首がありません。');
    return;
  }
  const ordered = (order === 'seq')
    ? pool.slice().sort((a, b) => (a.no || 0) - (b.no || 0))
    : shuffle(pool);
  studySession = {
    unitId, unitIds, subjectId, mode, order,
    questions: ordered,
    index: 0,
    startedAt: Date.now()
  };
  initHyakuninState();
  showScreen('hyakunin-quiz');
}

function initHyakuninState() {
  const s = studySession;
  if (!s || s.index >= s.questions.length) return;
  const seg = hyakuninSegments(s.questions[s.index]);
  const allLen = seg.kami.length + seg.shimo.length + 1;
  s.showAll = false;
  if (s.mode === 'progressive') {
    s.totalSteps = allLen;
    s.revealCount = 1;
  } else if (s.mode === 'blank') {
    const idxs = [];
    for (let i = 0; i < allLen; i++) idxs.push(i);
    const hideCount = Math.round(allLen / 2);
    s.hidden = new Set(shuffle(idxs).slice(0, hideCount));
    s.revealed = new Set();
  } else if (s.mode === 'meaning') {
    s.revealStep = 0; // 0:なし 1:上の句 2:+下の句 3:+詠み手
  }
}

function renderHyakuninQuiz() {
  const s = studySession;
  if (!s) { goBack(); return; }
  if (s.index >= s.questions.length) {
    document.getElementById('screen-hyakunin-quiz').innerHTML = `
      <div class="nav-bar">
        <button class="nav-button" id="hq-quit">‹ 戻る</button>
        <span class="nav-title">おわり</span>
        <span class="nav-spacer"></span>
      </div>
      <div class="content" style="text-align:center;padding-top:48px">
        <div style="font-size:52px;margin-bottom:12px">🎴</div>
        <div style="font-size:18px;font-weight:700;margin-bottom:6px">全${s.questions.length}首 おわり</div>
        <div style="color:var(--text-secondary);margin-bottom:28px">おつかれさま！</div>
        <button class="btn" id="hq-again">もう一度（${s.order === 'seq' ? '番号順' : 'シャッフル'}）</button>
        <button class="btn secondary" id="hq-home">単元へ戻る</button>
      </div>`;
    document.getElementById('hq-quit').onclick = goBack;
    document.getElementById('hq-home').onclick = goBack;
    document.getElementById('hq-again').onclick = () => startHyakuninQuiz({ unitId: s.unitId, subjectId: s.subjectId, mode: s.mode, order: s.order });
    return;
  }
  const q = s.questions[s.index];
  const seg = hyakuninSegments(q);
  const kamiN = seg.kami.length, shimoN = seg.shimo.length;
  const authorIdx = kamiN + shimoN;
  const modeTitle = s.mode === 'progressive' ? '少しずつ表示' : (s.mode === 'blank' ? '虫食い' : '訳を表示');

  const isRevealed = (gi) => {
    if (s.showAll) return true;
    if (s.mode === 'progressive') return gi < s.revealCount;
    if (s.mode === 'blank') return !s.hidden.has(gi) || s.revealed.has(gi);
    if (s.mode === 'meaning') {
      if (gi < kamiN) return s.revealStep >= 1;
      if (gi < authorIdx) return s.revealStep >= 2;
      return s.revealStep >= 3;
    }
    return false;
  };
  const segSpan = (text, gi) => {
    if (isRevealed(gi)) return `<span class="hk-seg hk-shown">${escapeHtml(text)}</span>`;
    const tappable = (s.mode === 'blank');
    return `<span class="hk-seg hk-hidden"${tappable ? ' data-gi="' + gi + '"' : ''}><span class="hk-mask">${escapeHtml(text)}</span></span>`;
  };

  let gi = 0;
  const kamiHtml = seg.kami.map(t => segSpan(t, gi++)).join(' ');
  const shimoHtml = seg.shimo.map(t => segSpan(t, gi++)).join(' ');
  const authorHtml = segSpan(seg.author, authorIdx);
  const meaningBlock = (s.mode === 'meaning')
    ? `<div class="hk-meaning"><div class="hk-label">現代語訳</div>${escapeHtml(q.meaning || '')}</div>`
    : '';
  const hint = s.mode === 'blank' ? '隠れた部分をタップすると表示' : 'タップで次を表示';

  document.getElementById('screen-hyakunin-quiz').innerHTML = `
    <div class="nav-bar">
      <button class="nav-button" id="hq-quit">中断</button>
      <span class="nav-title">${modeTitle}</span>
      <span class="nav-spacer"></span>
    </div>
    <div class="study-header">
      <div class="study-progress">${s.index + 1} / ${s.questions.length}　（第${q.no}首）</div>
    </div>
    <div class="content">
      ${meaningBlock}
      <div class="hk-poem" id="hq-poem">
        <div class="hk-line"><span class="hk-label">上の句</span><span class="hk-text">${kamiHtml}</span></div>
        <div class="hk-line"><span class="hk-label">下の句</span><span class="hk-text">${shimoHtml}</span></div>
        <div class="hk-line"><span class="hk-label">詠み手</span><span class="hk-text">${authorHtml}</span></div>
      </div>
      <div class="hk-hint">${hint}</div>
      <button class="btn" id="hq-showall">全文表示</button>
      <button class="btn secondary" id="hq-next">次の問題へ ›</button>
    </div>`;

  document.getElementById('hq-quit').onclick = async () => {
    const ok = await showConfirm('中断', '単元の選択画面に戻りますか?', { okText: '戻る' });
    if (ok) { studySession = null; goBack(); }
  };
  document.getElementById('hq-showall').onclick = () => { s.showAll = true; renderHyakuninQuiz(); };
  document.getElementById('hq-next').onclick = () => {
    s.index++;
    if (s.index < s.questions.length) initHyakuninState();
    renderHyakuninQuiz();
  };
  if (s.mode === 'blank') {
    document.querySelectorAll('#hq-poem .hk-hidden[data-gi]').forEach(el => {
      el.onclick = () => { s.revealed.add(parseInt(el.dataset.gi, 10)); renderHyakuninQuiz(); };
    });
  } else {
    document.getElementById('hq-poem').onclick = () => {
      if (s.showAll) return;
      if (s.mode === 'progressive' && s.revealCount < s.totalSteps) { s.revealCount++; renderHyakuninQuiz(); }
      else if (s.mode === 'meaning' && s.revealStep < 3) { s.revealStep++; renderHyakuninQuiz(); }
    };
  }
}

function renderHyakuninList(params) {
  const label = params && params.label ? params.label : '百人一首';
  let pool = state.questions.filter(q => q.type === 'hyakunin' && isUnitForProfile(getUnit(q.unitId)) && inUnitScope(q, params || {}));
  pool = pool.slice().sort((a, b) => (a.no || 0) - (b.no || 0));
  const markCell = (r) => {
    if (r === 'o') return '<span class="kl-r-o">○</span>';
    if (r === 'd') return '<span class="kl-r-d">△</span>';
    if (r === 'x') return '<span class="kl-r-x">×</span>';
    return '<span class="kl-r-none">−</span>';
  };
  const rows = pool.map(q => {
    const ks = getLatestResult(q.id, 'hk-kami-shimo', currentProfileId);
    const sk = getLatestResult(q.id, 'hk-shimo-kami', currentProfileId);
    const tc = (q.technique && q.technique.trim()) ? getLatestResult(q.id, 'hk-technique', currentProfileId) : null;
    const tcCell = (q.technique && q.technique.trim()) ? markCell(tc) : '<span class="kl-r-none">—</span>';
    const md = (q.modernKami && q.modernShimo) ? getLatestResult(q.id, 'hk-modern', currentProfileId) : null;
    const mdCell = (q.modernKami && q.modernShimo) ? markCell(md) : '<span class="kl-r-none">—</span>';
    return `
    <tr>
      <td class="hk-list-no">${q.no || ''}</td>
      <td class="hk-list-kami">${escapeHtml(q.kami || '')}</td>
      <td class="hk-list-shimo">${escapeHtml(q.shimo || '')}</td>
      <td class="hk-list-author">${escapeHtml(q.author || '')}</td>
      <td class="kl-result">${markCell(ks)}</td>
      <td class="kl-result">${markCell(sk)}</td>
      <td class="kl-result">${tcCell}</td>
      <td class="kl-result">${mdCell}</td>
    </tr>`;
  }).join('');
  const tableHtml = pool.length === 0
    ? '<div class="card" style="text-align:center;color:var(--text-secondary)">百人一首がありません</div>'
    : `<table class="kanji-list-table hk-list-table">
        <thead><tr><th>No</th><th>上の句</th><th>下の句</th><th>詠み手</th><th>上→下</th><th>下→上</th><th>技法</th><th>現代</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  document.getElementById('screen-hyakunin-list').innerHTML = `
    <div class="nav-bar">
      <button class="nav-button" id="hl-back">‹ 戻る</button>
      <span class="nav-title">${escapeHtml(label)} 全首</span>
      <span class="nav-spacer"></span>
    </div>
    <div class="content">
      <div class="section-label">${pool.length}首</div>
      ${tableHtml}
    </div>`;
  document.getElementById('hl-back').onclick = goBack;
}

/* ------------------------------------------------------------
   画面5: 結果サマリ
   ------------------------------------------------------------ */
function renderResult() {
  const s = studySession;
  if (!s) { goBack(); return; }
  const total = s.results.length;
  const o = s.results.filter(r => r.result === 'o').length;
  const d = s.results.filter(r => r.result === 'd').length;
  const x = s.results.filter(r => r.result === 'x').length;
  const rate = total > 0 ? Math.round((o / total) * 100) : 0;
  const elapsedMs = Date.now() - s.startedAt;
  const min = Math.floor(elapsedMs / 60000);
  const sec = Math.floor((elapsedMs % 60000) / 1000);

  // 間違えた問題 (x と d をリストアップ)
  // edb モードでは instanceId と entry id が異なるので instances から再取得
  const isEdb = s.instances && (s.mode || '').startsWith('edb-');
  const edbInstanceMap = isEdb
    ? new Map(s.instances.map(it => [it.instanceId, it]))
    : null;
  const mistakes = s.results.filter(r => r.result !== 'o').map(r => {
    if (isEdb) {
      const it = edbInstanceMap.get(r.questionId);
      return it ? { edb: it, mark: r.result } : null;
    }
    const q = getQuestion(r.questionId);
    return q ? { q, mark: r.result } : null;
  }).filter(Boolean);

  const mistakeHtml = mistakes.length === 0
    ? '<div class="card" style="text-align:center;color:var(--text-secondary)">全問正解!お見事!</div>'
    : mistakes.map(m => {
        if (m.edb) {
          return `
        <div class="result-mistake">
          <div class="result-mistake-q">${m.mark === 'd' ? '△' : '×'} <span class="edb-list-serial">No.${m.edb.serial}</span> ${m.edb.prompt.html}</div>
          <div class="result-mistake-a">→ ${m.edb.answer.html}</div>
        </div>`;
        }
        if (m.q && m.q.type === 'chemtable') {
          return `
        <div class="result-mistake">
          <div class="result-mistake-q">${m.mark === 'd' ? '△' : '×'} ${escapeHtml(m.q.name)} (${m.q.cat === 'acid' ? '酸' : '塩基'})</div>
          <div class="result-mistake-a">→ ${m.q.formula} ・ ${escapeHtml(m.q.valence)} ・ ${m.q.ionEq} ・ ${escapeHtml(m.q.strength)}</div>
        </div>`;
        }
        const d = questionDisplay(m.q, s.direction);
        return `
        <div class="result-mistake">
          <div class="result-mistake-q">${m.mark === 'd' ? '△' : '×'} ${escapeHtml(d.text)}</div>
          <div class="result-mistake-a">→ ${escapeHtml(d.answers.join(' / '))}</div>
        </div>`;
      }).join('');

  document.getElementById('screen-result').innerHTML = `
    <div class="nav-bar">
      <span class="nav-spacer"></span>
      <span class="nav-title">結果</span>
      <span class="nav-spacer"></span>
    </div>
    <div class="content">
      <div class="result-summary">
        <div class="result-rate">${rate}%</div>
        <div class="result-rate-label">正答率 (${o} / ${total} 問)</div>
        <div class="result-stats">
          <div class="result-stat o"><div class="result-stat-value">${o}</div><div class="result-stat-label">○ できた</div></div>
          <div class="result-stat d"><div class="result-stat-value">${d}</div><div class="result-stat-label">△ あやふや</div></div>
          <div class="result-stat x"><div class="result-stat-value">${x}</div><div class="result-stat-label">× できない</div></div>
        </div>
        <div style="font-size:13px;color:var(--text-secondary)">所要時間 ${min}分${sec}秒</div>
      </div>
      <div class="section-label">復習が必要な問題</div>
      ${mistakeHtml}
      <button class="btn" id="r-again" style="margin-top:16px">もう一度同じ範囲を学習</button>
      <button class="btn secondary" id="r-redir">出題方法を選び直す</button>
      <button class="btn secondary" id="r-home">ホームへ戻る</button>
    </div>`;

  // 現在のセッションから出題方法選択(direction)画面への params を生成
  const dirParams = () => {
    const p = { unitId: s.unitId, unitIds: s.unitIds, subjectId: s.subjectId, reviewMode: s.reviewMode, order: s.order, lesson: s.lesson, testMode: s.testMode, label: s.label };
    if (!p.label) {
      if (p.unitIds && p.unitIds.length) p.label = '選択した ' + p.unitIds.length + ' 単元';
      else if (p.unitId) { const u = getUnit(p.unitId); if (u) p.label = u.name; }
      else if (p.lesson) p.label = p.lesson + ' 実力テスト';
      else if (p.subjectId) { const sub = getSubject(p.subjectId); if (sub) p.label = sub.name + ' 全単元'; }
    }
    return p;
  };
  // subject / mode から 出題方法選択画面 名を判定
  const directionScreenName = () => {
    const mode = s.mode || '';
    if (mode.startsWith('edb-')) return 'edb-direction';
    if (mode.startsWith('chem-')) return 'chem-direction';
    if (mode === 'en-ja' || mode === 'ja-en' || mode === 'en-def-en' || mode === 'listen') return 'english-direction';
    if (mode === 'hk-graded' || mode === 'progressive' || mode === 'blank' || mode === 'meaning') return 'hyakunin-direction';
    // 漢字 or その他
    const u = s.unitId ? getUnit(s.unitId) : null;
    const subId = s.subjectId || (u && u.subjectId);
    if (subId === 'kanji' || (u && u.subjectId === 'kanji')) return 'study-direction';
    if (subId === 'chem-basic') return 'chem-direction';
    if (subId === 'hyakunin') return 'hyakunin-direction';
    return null; // 社会/理科 は direction 画面がない
  };

  document.getElementById('r-again').onclick = () => {
    const params = { unitId: s.unitId, unitIds: s.unitIds, subjectId: s.subjectId, direction: s.direction, reviewMode: s.reviewMode, order: s.order, lesson: s.lesson, testMode: s.testMode };
    const mode = s.mode;
    studySession = null;
    if (mode === 'en-ja' || mode === 'ja-en' || mode === 'en-def-en') {
      startEnglishBatch({ ...params, mode });
    } else if (mode === 'listen') {
      startEnglishListen(params);
    } else if (mode && mode.startsWith('edb-')) {
      startEdbBatch({ ...params, mode });
    } else if (mode && mode.startsWith('chem-')) {
      startChemBatch({ ...params, mode });
    } else if (mode === 'hk-graded') {
      startHyakuninGraded(params);
    } else {
      startStudy(params);
    }
  };
  document.getElementById('r-redir').onclick = () => {
    const target = directionScreenName();
    studySession = null;
    if (target) {
      // 結果 → direction まで一気に戻す (navStack から result 分を除外して direction を表示)
      navStack = [];
      showScreen(target, dirParams(), true);
    } else {
      // direction 画面がない教科 → units 画面へ戻す
      navStack = [];
      const subId = s.subjectId || (s.unitId && (getUnit(s.unitId) || {}).subjectId);
      if (subId) showScreen('units', { subjectId: subId }, true);
      else showScreen('home', {}, true);
    }
  };
  document.getElementById('r-home').onclick = () => {
    studySession = null;
    navStack = [];
    showScreen('home', {}, true);
  };
}

const PRINT_LAYOUTS = {
  10: { cols: 2, rows: 5 },
  15: { cols: 3, rows: 5 },
  20: { cols: 4, rows: 5 },
  25: { cols: 5, rows: 5 },
  30: { cols: 5, rows: 6 }
};

function renderPrint(params) {
  if (!printConfig) {
    printConfig = {
      subjectId: 'all',
      unitId: 'all',
      perPage: 20,
      paper: 'A4',
      output: 'question',  // 'question' | 'with-answer' | 'answer-only'
      direction: 'kakitori' // for 漢字: 'kakitori' | 'yomi'
    };
  }
  // params で渡された場合、設定を上書き (study-direction から進入)
  if (params && (params.subjectId || params.unitId)) {
    if (params.subjectId) printConfig.subjectId = params.subjectId;
    if (params.unitId) printConfig.unitId = params.unitId;
  }
  const cfg = printConfig;
  // 旧 count キーが残っていたら除去
  if ('count' in cfg) delete cfg.count;
  if (!cfg.perPage) cfg.perPage = 20;
  if (!cfg.direction) cfg.direction = 'kakitori';

  // 単元プルダウンは教科に応じて変化
  const subjectOptions = ['<option value="all">すべての教科</option>']
    .concat(state.subjects.map(s => `<option value="${s.id}" ${cfg.subjectId === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`))
    .join('');
  let unitOptions = '<option value="all">すべての単元</option>';
  if (cfg.subjectId !== 'all') {
    unitOptions += state.units
      .filter(u => u.subjectId === cfg.subjectId && isUnitForProfile(u))
      .map(u => `<option value="${u.id}" ${cfg.unitId === u.id ? 'selected' : ''}>${escapeHtml(u.name)}</option>`)
      .join('');
  }

  // 出題プールを計算 (全問・順番固定)
  const pool = collectPrintPool(cfg);
  const totalPages = Math.max(1, Math.ceil(pool.length / cfg.perPage));
  const isKanjiPool = pool.length > 0 && pool.every(q => q.type === 'kanji');

  const perPageOptions = [10, 15, 20, 25, 30].map(n =>
    `<label class="radio-item ${cfg.perPage === n ? 'selected' : ''}"><span class="radio-dot"></span><input type="radio" name="perpage" value="${n}" hidden>${n}問</label>`
  ).join('');

  const directionField = isKanjiPool
    ? `<div class="field">
        <div class="field-label">出題向き</div>
        <div class="radio-group" id="pr-direction">
          <label class="radio-item ${cfg.direction === 'kakitori' ? 'selected' : ''}"><span class="radio-dot"></span><input type="radio" name="direction" value="kakitori" hidden>✏️ 書き取り</label>
          <label class="radio-item ${cfg.direction === 'yomi' ? 'selected' : ''}"><span class="radio-dot"></span><input type="radio" name="direction" value="yomi" hidden>📖 よみ</label>
        </div>
      </div>`
    : '';

  document.getElementById('screen-print').innerHTML = `
    <div class="nav-bar">
      <button class="nav-button" id="pr-back">‹ 戻る</button>
      <span class="nav-title">印刷モード</span>
      <span class="nav-spacer"></span>
    </div>
    <div class="content">
      <div class="field">
        <div class="field-label">教科</div>
        <select class="select" id="pr-subject">${subjectOptions}</select>
      </div>
      <div class="field">
        <div class="field-label">単元</div>
        <select class="select" id="pr-unit" ${cfg.subjectId === 'all' ? 'disabled' : ''}>${unitOptions}</select>
      </div>
      ${directionField}
      <div class="field">
        <div class="field-label">1ページあたりの問題数</div>
        <div class="radio-group" id="pr-perpage">${perPageOptions}</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:6px">範囲内の全 ${pool.length}問 を <b>${totalPages}ページ</b> に分けて印刷します</div>
      </div>
      <div class="field">
        <div class="field-label">用紙サイズ</div>
        <div class="radio-group" id="pr-paper">
          <label class="radio-item ${cfg.paper === 'A4' ? 'selected' : ''}"><span class="radio-dot"></span><input type="radio" name="paper" value="A4" hidden>A4</label>
          <label class="radio-item ${cfg.paper === 'B5' ? 'selected' : ''}"><span class="radio-dot"></span><input type="radio" name="paper" value="B5" hidden>B5</label>
        </div>
      </div>
      <div class="field">
        <div class="field-label">出力種別</div>
        <div class="radio-group" id="pr-output">
          <label class="radio-item ${cfg.output === 'question' ? 'selected' : ''}"><span class="radio-dot"></span><input type="radio" name="output" value="question" hidden>問題のみ(解答欄つき)</label>
          <label class="radio-item ${cfg.output === 'with-answer' ? 'selected' : ''}"><span class="radio-dot"></span><input type="radio" name="output" value="with-answer" hidden>解答つき</label>
          <label class="radio-item ${cfg.output === 'answer-only' ? 'selected' : ''}"><span class="radio-dot"></span><input type="radio" name="output" value="answer-only" hidden>解答のみ</label>
        </div>
      </div>

      <div class="section-label">プレビュー (1ページ目の内容)</div>
      <div class="print-preview">
        ${buildPreviewHtml(pool.slice(0, cfg.perPage), cfg)}
      </div>

      <button class="btn" id="pr-print" ${pool.length === 0 ? 'disabled style="opacity:0.5"' : ''}>🖨 印刷する (全${totalPages}ページ)</button>
      <button class="btn secondary" id="pr-pdf" ${pool.length === 0 ? 'disabled style="opacity:0.5"' : ''}>📄 PDFとして保存</button>
    </div>`;

  // イベント
  document.getElementById('pr-back').onclick = goBack;
  document.getElementById('pr-subject').onchange = e => {
    cfg.subjectId = e.target.value;
    cfg.unitId = 'all';
    renderPrint();
  };
  document.getElementById('pr-unit').onchange = e => {
    cfg.unitId = e.target.value;
    renderPrint();
  };
  document.querySelectorAll('#pr-perpage .radio-item').forEach(item => {
    item.onclick = () => {
      cfg.perPage = parseInt(item.querySelector('input').value, 10);
      renderPrint();
    };
  });
  document.querySelectorAll('#pr-paper .radio-item').forEach(item => {
    item.onclick = () => {
      cfg.paper = item.querySelector('input').value;
      renderPrint();
    };
  });
  document.querySelectorAll('#pr-output .radio-item').forEach(item => {
    item.onclick = () => {
      cfg.output = item.querySelector('input').value;
      renderPrint();
    };
  });
  if (isKanjiPool) {
    document.querySelectorAll('#pr-direction .radio-item').forEach(item => {
      item.onclick = () => {
        cfg.direction = item.querySelector('input').value;
        renderPrint();
      };
    });
  }
  document.getElementById('pr-print').onclick = () => {
    document.getElementById('print-area').innerHTML = buildPrintHtml(pool, cfg);
    setPrintPaperSize(cfg.paper);
    setTimeout(() => window.print(), 50);
  };
  document.getElementById('pr-pdf').onclick = async () => {
    await showAlert(
      'PDFとして保存',
      'このあと印刷ダイアログが開きます。\n\n• PCの場合: 「保存先 / 送信先」を「PDFに保存」に変更して保存\n• iPhoneの場合: プレビューを上にスワイプ（または拡大）→ 共有ボタンから「ファイルに保存」'
    );
    document.getElementById('print-area').innerHTML = buildPrintHtml(pool, cfg);
    setPrintPaperSize(cfg.paper);
    setTimeout(() => window.print(), 50);
  };
}

// 印刷用の出題プール (対象を絞り、順番は維持)
function collectPrintPool(cfg) {
  let pool = state.questions.filter(q => isUnitForProfile(getUnit(q.unitId)));
  if (cfg.subjectId !== 'all') {
    pool = pool.filter(q => {
      const u = getUnit(q.unitId);
      return u && u.subjectId === cfg.subjectId;
    });
  }
  if (cfg.unitId && cfg.unitId !== 'all') {
    pool = pool.filter(q => q.unitId === cfg.unitId);
  }
  return pool;
}

// プレビュー: 1ページ目相当の内容を画面で表示
function buildPreviewHtml(items, cfg) {
  if (items.length === 0) return '<div style="color:#666">出題できる問題がありません</div>';
  const title = printTitle(cfg);
  const dir = cfg.direction || 'kakitori';
  const dirLabel = dir === 'yomi' ? 'よみ' : '書き取り';
  const isKanjiPool = items.every(q => q.type === 'kanji');
  if (isKanjiPool) {
    // 漢字は簡易リストでプレビュー (実際の印刷は縦書きグリッド)
    const list = items.map(q => {
      const d = questionDisplay(q, dir);
      const ans = cfg.output === 'with-answer' || cfg.output === 'answer-only'
        ? `<span class="answer-text">[${escapeHtml(d.answers.join(' / '))}]</span>`
        : '<span class="answer-line"></span>';
      return `<li>${escapeHtml(d.text)} ${ans}</li>`;
    }).join('');
    return `<h2>${escapeHtml(title)} ${dirLabel}</h2>
      <div class="meta"><span>${escapeHtml(title)} (${dirLabel})</span><span>名前:_______________</span></div>
      <div style="font-size:11px;color:#666;margin-bottom:8px">※ 印刷時は学校の書き取りプリント風に縦書きグリッドで出力されます</div>
      <ol>${list}</ol>`;
  }
  if (cfg.output === 'answer-only') {
    return `<h2>${escapeHtml(title)} 解答</h2>
      <div class="meta"><span>${escapeHtml(title)}</span><span>名前:_______________</span></div>
      <ol>` +
      items.map(q => {
        const d = questionDisplay(q, dir);
        return `<li><span class="answer-text">${escapeHtml(d.answers.join(' / '))}</span></li>`;
      }).join('') +
      '</ol>';
  }
  return `<h2>${escapeHtml(title)}</h2>
    <div class="meta"><span>${escapeHtml(title)}</span><span>名前:_______________</span></div>
    <ol>` +
    items.map(q => {
      const d = questionDisplay(q, dir);
      const ans = cfg.output === 'with-answer'
        ? `<span class="answer-text">[${escapeHtml(d.answers.join(' / '))}]</span>`
        : '<span class="answer-line"></span>';
      return `<li>${escapeHtml(d.text)} ${ans}</li>`;
    }).join('') +
    '</ol>';
}

// 実印刷HTML: 漢字は縦書きグリッド、それ以外はリスト
function buildPrintHtml(items, cfg) {
  if (items.length === 0) return '';
  const isKanjiPool = items.every(q => q.type === 'kanji');
  if (isKanjiPool) return buildKanjiPrintHtml(items, cfg);
  return buildListPrintHtml(items, cfg);
}

function buildKanjiPrintHtml(items, cfg) {
  const dir = cfg.direction || 'kakitori';
  const dirLabel = dir === 'yomi' ? 'よみ' : '書き取り';
  const perPage = cfg.perPage || 20;
  const lay = PRINT_LAYOUTS[perPage] || { cols: 4, rows: Math.ceil(perPage / 4) };
  const totalPages = Math.max(1, Math.ceil(items.length / perPage));
  const pages = [];
  for (let i = 0; i < items.length; i += perPage) pages.push(items.slice(i, i + perPage));

  const title = printTitle(cfg);
  return pages.map((pageItems, pageIdx) => {
    const cells = pageItems.map(q => {
      const d = questionDisplay(q, dir);
      const r = getLatestResult(q.id, dir);
      const markCh = r === 'o' ? '○' : (r === 'd' ? '△' : (r === 'x' ? '×' : ''));
      const mark = r ? `<span class="kp-mark ${r}">${markCh}</span>` : '';
      // 問題側 (向きにより漢字か読み)
      const qClass = (dir === 'yomi') ? 'kp-q kp-q-large' : 'kp-q';
      const qHtml = `<div class="${qClass}">${escapeHtml(d.text)}</div>`;
      // 解答側
      let aHtml;
      if (cfg.output === 'with-answer' || cfg.output === 'answer-only') {
        const ansText = (d.answers && d.answers[0]) || '';
        const aCls = (dir === 'yomi') ? 'kp-a kp-a-shown kp-a-yomi' : 'kp-a kp-a-shown';
        aHtml = `<div class="${aCls}">${escapeHtml(ansText)}</div>`;
      } else {
        aHtml = '<div class="kp-a"></div>';
      }
      return `<div class="kp-cell">${mark}${qHtml}${aHtml}</div>`;
    }).join('');
    // 余り枠 (空セル) でグリッドを埋める
    const fillerCount = perPage - pageItems.length;
    const fillers = fillerCount > 0
      ? Array(fillerCount).fill('<div class="kp-cell kp-cell-empty"></div>').join('')
      : '';
    return `<div class="kp-page">
      <div class="kp-header">
        <span class="kp-title">${escapeHtml(title)} (${dirLabel})</span>
        <span>名前:______________</span>
        <span>${pageIdx + 1} / ${totalPages}</span>
      </div>
      <div class="kp-grid cols-${lay.cols} rows-${lay.rows}">${cells}${fillers}</div>
    </div>`;
  }).join('');
}

function buildListPrintHtml(items, cfg) {
  const dir = cfg.direction || 'kakitori';
  const perPage = cfg.perPage || 20;
  const totalPages = Math.max(1, Math.ceil(items.length / perPage));
  const pages = [];
  for (let i = 0; i < items.length; i += perPage) pages.push(items.slice(i, i + perPage));
  const title = printTitle(cfg);
  return pages.map((pageItems, pageIdx) => {
    const startNum = pageIdx * perPage + 1;
    const pageHeader = `<h2>${escapeHtml(title)}${cfg.output === 'answer-only' ? ' 解答' : ''} (${pageIdx + 1}/${totalPages})</h2>
      <div class="meta"><span>${escapeHtml(title)}</span><span>名前:______________</span></div>`;
    if (cfg.output === 'answer-only') {
      const lis = pageItems.map((q, i) => {
        const d = questionDisplay(q, dir);
        return `<li value="${startNum + i}"><span class="answer-text">${escapeHtml(d.answers.join(' / '))}</span></li>`;
      }).join('');
      return `<div class="print-page">${pageHeader}<ol start="${startNum}">${lis}</ol></div>`;
    }
    const lis = pageItems.map((q, i) => {
      const d = questionDisplay(q, dir);
      const ans = cfg.output === 'with-answer'
        ? `<span class="answer-text">[${escapeHtml(d.answers.join(' / '))}]</span>`
        : '<span class="answer-line"></span>';
      return `<li value="${startNum + i}">${escapeHtml(d.text)} ${ans}</li>`;
    }).join('');
    return `<div class="print-page">${pageHeader}<ol start="${startNum}">${lis}</ol></div>`;
  }).join('');
}

function printTitle(cfg) {
  const parts = [];
  if (cfg.subjectId === 'all') parts.push('全教科');
  else {
    const s = getSubject(cfg.subjectId);
    if (s) parts.push(s.name);
    if (cfg.unitId !== 'all') {
      const u = getUnit(cfg.unitId);
      if (u) parts.push(u.name);
    }
  }
  return parts.join(' ');
}

// 用紙サイズを @page CSSに動的注入
function setPrintPaperSize(paper) {
  let style = document.getElementById('print-paper-style');
  if (!style) {
    style = document.createElement('style');
    style.id = 'print-paper-style';
    document.head.appendChild(style);
  }
  style.textContent = `@media print { @page { size: ${paper}; margin: 12mm; } }`;
}

   画面7: 問題管理
   ------------------------------------------------------------ */
let qmFilter = { subjectId: 'all', unitId: 'all' };

function renderQuestionMgmt() {
  const subjectOpts = ['<option value="all">すべての教科</option>']
    .concat(state.subjects.map(s => `<option value="${s.id}" ${qmFilter.subjectId === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`))
    .join('');
  let unitOpts = '<option value="all">すべての単元</option>';
  if (qmFilter.subjectId !== 'all') {
    unitOpts += state.units
      .filter(u => u.subjectId === qmFilter.subjectId)
      .map(u => `<option value="${u.id}" ${qmFilter.unitId === u.id ? 'selected' : ''}>${escapeHtml(u.name)}</option>`)
      .join('');
  }

  // フィルタ適用
  let qs = state.questions.slice();
  if (qmFilter.subjectId !== 'all') {
    qs = qs.filter(q => {
      const u = getUnit(q.unitId);
      return u && u.subjectId === qmFilter.subjectId;
    });
  }
  if (qmFilter.unitId !== 'all') {
    qs = qs.filter(q => q.unitId === qmFilter.unitId);
  }

  const itemsHtml = qs.length === 0
    ? '<div class="card" style="text-align:center;color:var(--text-secondary)">問題がありません</div>'
    : qs.map(q => {
        const unit = getUnit(q.unitId);
        const subj = unit ? getSubject(unit.subjectId) : null;
        const tag = (subj ? subj.name : '?') + ' / ' + (unit ? unit.name : '?');
        let qText, aText;
        if (q.type === 'kanji') {
          qText = q.yomi || ''; aText = q.kanji || '';
        } else if (q.type === 'english') {
          qText = q.ja || ''; aText = q.en || '';
        } else if (q.type === 'hyakunin') {
          qText = (q.no ? q.no + '. ' : '') + (q.kami || ''); aText = (q.shimo || '') + ' — ' + (q.author || '');
        } else {
          qText = q.question || ''; aText = (q.answers || []).join(' / ');
        }
        return `
          <div class="qm-item">
            <div class="qm-item-meta">${escapeHtml(tag)}</div>
            <div class="qm-item-q">${escapeHtml(qText)}</div>
            <div class="qm-item-a">→ ${escapeHtml(aText)}</div>
            <div class="qm-item-actions">
              <button class="btn small secondary" data-act="edit" data-id="${q.id}">編集</button>
              <button class="btn small danger" data-act="delete" data-id="${q.id}">削除</button>
            </div>
          </div>`;
      }).join('');

  document.getElementById('screen-question-mgmt').innerHTML = `
    <div class="nav-bar">
      <button class="nav-button" id="qm-back">‹ 戻る</button>
      <span class="nav-title">問題管理</span>
      <button class="nav-button" id="qm-subject-mgmt">教科</button>
    </div>
    <div class="content">
      <div class="filter-row">
        <select class="select" id="qm-f-sub">${subjectOpts}</select>
        <select class="select" id="qm-f-unit" ${qmFilter.subjectId === 'all' ? 'disabled' : ''}>${unitOpts}</select>
      </div>
      <button class="btn" id="qm-add">＋ 問題を追加</button>
      <div class="section-label">${qs.length}件</div>
      ${itemsHtml}
    </div>`;

  document.getElementById('qm-back').onclick = () => {
    if (currentProfileId) goBack();
    else showScreen('profile-select', {}, true);
  };
  document.getElementById('qm-subject-mgmt').onclick = () => showScreen('subject-mgmt');
  document.getElementById('qm-f-sub').onchange = e => {
    qmFilter.subjectId = e.target.value;
    qmFilter.unitId = 'all';
    renderQuestionMgmt();
  };
  document.getElementById('qm-f-unit').onchange = e => {
    qmFilter.unitId = e.target.value;
    renderQuestionMgmt();
  };
  document.getElementById('qm-add').onclick = () => {
    const initialUnit = (qmFilter.unitId !== 'all') ? qmFilter.unitId : null;
    showScreen('question-edit', { questionId: null, unitId: initialUnit });
  };
  document.querySelectorAll('#screen-question-mgmt [data-act="edit"]').forEach(b => {
    b.onclick = () => showScreen('question-edit', { questionId: b.dataset.id });
  });
  document.querySelectorAll('#screen-question-mgmt [data-act="delete"]').forEach(b => {
    b.onclick = async () => {
      const ok = await showConfirm('問題を削除', 'この問題を削除しますか? (履歴も一緒に削除されます)', { okText: '削除', danger: true });
      if (!ok) return;
      const id = b.dataset.id;
      state.questions = state.questions.filter(q => q.id !== id);
      // 履歴も対応するものを削除
      Object.keys(state.history).forEach(pid => {
        state.history[pid] = state.history[pid].filter(h => h.questionId !== id);
      });
      saveState();
      showToast('削除しました');
      renderQuestionMgmt();
    };
  });
}

/* ------------------------------------------------------------
   画面: 問題編集 (新規/編集兼用)
   ------------------------------------------------------------ */
function renderQuestionEdit(questionId, defaultUnitId) {
  const isNew = !questionId;
  const q = isNew
    ? { id: null, unitId: defaultUnitId || (state.units[0] && state.units[0].id), type: 'qa', question: '', answers: [''], hint: '', sourceNote: '' }
    : Object.assign({}, getQuestion(questionId));
  if (!q) { goBack(); return; }
  if (q.type !== 'kanji' && q.type !== 'english' && q.type !== 'hyakunin' && (!q.answers || q.answers.length === 0)) q.answers = [''];
  const isKanji = q.type === 'kanji';
  const isEnglish = q.type === 'english';
  const isHyakunin = q.type === 'hyakunin';

  // 単元プルダウンを教科ごとにグループ化
  const unitOptionsHtml = state.subjects.map(s => {
    const us = state.units.filter(u => u.subjectId === s.id);
    if (us.length === 0) return '';
    return `<optgroup label="${escapeHtml(s.name)}">` +
      us.map(u => `<option value="${u.id}" ${q.unitId === u.id ? 'selected' : ''}>${escapeHtml(u.name)}</option>`).join('') +
      `</optgroup>`;
  }).join('');

  let fieldsHtml;
  if (isKanji) {
    fieldsHtml = `
      <div class="field">
        <div class="field-label">漢字</div>
        <input class="input" id="qe-kanji" placeholder="例: 宗教" value="${escapeHtml(q.kanji || '')}">
      </div>
      <div class="field">
        <div class="field-label">よみ (ひらがな)</div>
        <input class="input" id="qe-yomi" placeholder="例: しゅうきょう" value="${escapeHtml(q.yomi || '')}">
      </div>`;
  } else if (isEnglish) {
    fieldsHtml = `
      <div class="field">
        <div class="field-label">英語</div>
        <input class="input" id="qe-en" placeholder="例: building" value="${escapeHtml(q.en || '')}">
      </div>
      <div class="field">
        <div class="field-label">日本語</div>
        <input class="input" id="qe-ja" placeholder="例: 建物" value="${escapeHtml(q.ja || '')}">
      </div>`;
  } else if (isHyakunin) {
    fieldsHtml = `
      <div class="field">
        <div class="field-label">上の句</div>
        <textarea class="textarea" id="qe-kami">${escapeHtml(q.kami || '')}</textarea>
      </div>
      <div class="field">
        <div class="field-label">下の句</div>
        <textarea class="textarea" id="qe-shimo">${escapeHtml(q.shimo || '')}</textarea>
      </div>
      <div class="field">
        <div class="field-label">意味 (現代語訳)</div>
        <textarea class="textarea" id="qe-meaning">${escapeHtml(q.meaning || '')}</textarea>
      </div>
      <div class="field">
        <div class="field-label">詠み手 (作者)</div>
        <input class="input" id="qe-author" value="${escapeHtml(q.author || '')}">
      </div>
      <div class="field">
        <div class="field-label">主な表現技法</div>
        <input class="input" id="qe-technique" value="${escapeHtml(q.technique || '')}">
      </div>`;
  } else {
    fieldsHtml = `
      <div class="field">
        <div class="field-label">問題文</div>
        <textarea class="textarea" id="qe-q" placeholder="例: 江戸幕府を開いた人物は?">${escapeHtml(q.question || '')}</textarea>
      </div>
      <div class="field">
        <div class="field-label">解答 (将来的に複数登録可能)</div>
        <input class="input" id="qe-a" placeholder="例: 徳川家康" value="${escapeHtml((q.answers || [''])[0])}">
      </div>`;
  }

  document.getElementById('screen-question-edit').innerHTML = `
    <div class="nav-bar">
      <button class="nav-button" id="qe-cancel">キャンセル</button>
      <span class="nav-title">${isNew ? '問題を追加' : '問題を編集'}</span>
      <button class="nav-button" id="qe-save"><b>保存</b></button>
    </div>
    <div class="content">
      <div class="field">
        <div class="field-label">単元</div>
        <select class="select" id="qe-unit">${unitOptionsHtml}</select>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">単元がない場合は「教科」から追加してください</div>
      </div>
      ${fieldsHtml}
      <div class="field">
        <div class="field-label">ヒント (任意)</div>
        <input class="input" id="qe-hint" value="${escapeHtml(q.hint || '')}">
      </div>
      <div class="field">
        <div class="field-label">出典メモ (任意)</div>
        <input class="input" id="qe-src" placeholder="例: 教科書p.34" value="${escapeHtml(q.sourceNote || '')}">
      </div>
      ${!isNew ? '<button class="btn danger" id="qe-delete">この問題を削除</button>' : ''}
    </div>`;

  document.getElementById('qe-cancel').onclick = goBack;
  document.getElementById('qe-save').onclick = () => {
    const unitId = document.getElementById('qe-unit').value;
    const hint = document.getElementById('qe-hint').value.trim();
    const src = document.getElementById('qe-src').value.trim();
    if (!unitId) { showAlert('単元を選んでください'); return; }
    let question, answer, kanji, yomi, en, ja, kami, shimo, meaning, author, technique;
    if (isKanji) {
      kanji = document.getElementById('qe-kanji').value.trim();
      yomi = document.getElementById('qe-yomi').value.trim();
      if (!kanji) { showAlert('漢字を入力してください'); return; }
      if (!yomi) { showAlert('よみを入力してください'); return; }
    } else if (isEnglish) {
      en = document.getElementById('qe-en').value.trim();
      ja = document.getElementById('qe-ja').value.trim();
      if (!en) { showAlert('英語を入力してください'); return; }
      if (!ja) { showAlert('日本語を入力してください'); return; }
    } else if (isHyakunin) {
      kami = document.getElementById('qe-kami').value.trim();
      shimo = document.getElementById('qe-shimo').value.trim();
      meaning = document.getElementById('qe-meaning').value.trim();
      author = document.getElementById('qe-author').value.trim();
      technique = document.getElementById('qe-technique').value.trim();
      if (!kami) { showAlert('上の句を入力してください'); return; }
      if (!shimo) { showAlert('下の句を入力してください'); return; }
    } else {
      question = document.getElementById('qe-q').value.trim();
      answer = document.getElementById('qe-a').value.trim();
      if (!question) { showAlert('問題文を入力してください'); return; }
      if (!answer) { showAlert('解答を入力してください'); return; }
    }

    if (isNew) {
      state.questions.push({
        id: genId('q'),
        unitId,
        type: 'qa',
        question,
        answers: [answer],
        hint, sourceNote: src,
        createdAt: todayStr()
      });
    } else {
      const target = getQuestion(q.id);
      target.unitId = unitId;
      target.hint = hint;
      target.sourceNote = src;
      if (isKanji) {
        target.kanji = kanji;
        target.yomi = yomi;
      } else if (isEnglish) {
        target.en = en;
        target.ja = ja;
      } else if (isHyakunin) {
        target.kami = kami;
        target.shimo = shimo;
        target.meaning = meaning;
        target.author = author;
        target.technique = technique;
      } else {
        target.question = question;
        target.answers = [answer];
      }
    }
    saveState();
    showToast(isNew ? '追加しました' : '保存しました');
    goBack();
  };
  if (!isNew) {
    document.getElementById('qe-delete').onclick = async () => {
      const ok = await showConfirm('問題を削除', 'この問題を削除しますか?', { okText: '削除', danger: true });
      if (!ok) return;
      state.questions = state.questions.filter(x => x.id !== q.id);
      Object.keys(state.history).forEach(pid => {
        state.history[pid] = state.history[pid].filter(h => h.questionId !== q.id);
      });
      saveState();
      showToast('削除しました');
      goBack();
    };
  }
}

    <div class="nav-bar">
      <button class="nav-button" id="sm-back">‹ 戻る</button>
      <span class="nav-title">教科・単元の管理</span>
      <span class="nav-spacer"></span>

      <button class="btn" id="sm-add-sub">＋ 教科を追加</button>
      ${subjectsHtml}

    showToast('教科を追加しました');
    renderSubjectMgmt();
  };
  document.querySelectorAll('#screen-subject-mgmt [data-sact]').forEach(b => {
    b.onclick = async () => {
      const act = b.dataset.sact;
      const id = b.dataset.id;
      if (act === 'rename-sub') {
        const sub = getSubject(id);
        const name = prompt('教科名', sub.name);
        if (name) { sub.name = name.trim(); saveState(); renderSubjectMgmt(); }
      } else if (act === 'del-sub') {
        const sub = getSubject(id);
        const unitIds = state.units.filter(u => u.subjectId === id).map(u => u.id);
        const qids = state.questions.filter(q => unitIds.includes(q.unitId)).map(q => q.id);
        const ok = await showConfirm('教科を削除',
          `「${sub.name}」と配下の単元 ${unitIds.length}件・問題 ${qids.length}件 をすべて削除します。よろしいですか?`,
          { okText: '削除', danger: true });
        if (!ok) return;
        state.subjects = state.subjects.filter(s => s.id !== id);
        state.units = state.units.filter(u => u.subjectId !== id);
        state.questions = state.questions.filter(q => !qids.includes(q.id));
        Object.keys(state.history).forEach(pid => {
          state.history[pid] = state.history[pid].filter(h => !qids.includes(h.questionId));
        });
        saveState();
        showToast('削除しました');
        renderSubjectMgmt();
      } else if (act === 'add-unit') {
        const name = prompt('単元名を入力してください');
        if (!name) return;
        state.units.push({ id: genId('u'), subjectId: id, name: name.trim(), parentId: null });
        saveState();
        showToast('単元を追加しました');
        renderSubjectMgmt();
      }
    };
  });
  document.querySelectorAll('#screen-subject-mgmt [data-uact]').forEach(b => {
    b.onclick = async () => {
      const act = b.dataset.uact;
      const id = b.dataset.id;
      if (act === 'rename') {
        const u = getUnit(id);
        const name = prompt('単元名', u.name);
        if (name) { u.name = name.trim(); saveState(); renderSubjectMgmt(); }
      } else if (act === 'delete') {
        const u = getUnit(id);
        const qids = state.questions.filter(q => q.unitId === id).map(q => q.id);
        const ok = await showConfirm('単元を削除',
          `「${u.name}」と配下の問題 ${qids.length}件 を削除します。よろしいですか?`,
          { okText: '削除', danger: true });
        if (!ok) return;
        state.units = state.units.filter(x => x.id !== id);
        state.questions = state.questions.filter(q => q.unitId !== id);
        Object.keys(state.history).forEach(pid => {
          state.history[pid] = state.history[pid].filter(h => !qids.includes(h.questionId));
        });
        saveState();
        showToast('削除しました');
        renderSubjectMgmt();
      }
    };
  });
}

/* ------------------------------------------------------------
   画面: データ管理
   ------------------------------------------------------------ */
function renderDataMgmt() {
  // 統計
  const totalQ = state.questions.length;
  const totalSub = state.subjects.length;
  const totalUnit = state.units.length;
  const histStats = state.profiles.map(p => {
    const h = state.history[p.id] || [];
    return `${p.name}: ${h.length}件`;
  }).join(' / ');

  document.getElementById('screen-data-mgmt').innerHTML = `
    <div class="nav-bar">
      <button class="nav-button" id="dm-back">‹ 戻る</button>
      <span class="nav-title">データ管理</span>
      <span class="nav-spacer"></span>
    </div>
    <div class="content">
      <div class="card">
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px">現在のデータ</div>
        <div>教科 ${totalSub} / 単元 ${totalUnit} / 問題 ${totalQ}</div>
        <div style="font-size:13px;color:var(--text-secondary);margin-top:4px">学習履歴 - ${histStats}</div>
      </div>
      <button class="btn" id="dm-export">⬇ JSONをエクスポート</button>
      <button class="btn secondary" id="dm-import">⬆ JSONをインポート</button>
      <input type="file" id="dm-file" accept="application/json,.json" style="display:none">
      <div style="height:24px"></div>
      <button class="btn danger" id="dm-reset">⚠ 全データをリセット</button>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:8px;text-align:center">リセットするとサンプルデータに戻ります</div>
    </div>`;

  document.getElementById('dm-back').onclick = goBack;
  document.getElementById('dm-export').onclick = doExport;
  document.getElementById('dm-import').onclick = () => document.getElementById('dm-file').click();
  document.getElementById('dm-file').onchange = doImport;
  document.getElementById('dm-reset').onclick = doReset;
}

function doExport() {
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `study-app-data-${todayCompact()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('エクスポートしました');
}

async function doImport(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const imported = JSON.parse(text);
    if (!imported || !imported.subjects || !imported.units || !imported.questions) {
      throw new Error('データ形式が正しくありません');
    }
    const choice = await showConfirm('インポート方法',
      '「OK」で現在のデータを置き換え、「キャンセル」で操作をやめます。\n\n※ マージはしません (置き換えのみ)',
      { okText: '置き換え', danger: true });
    if (!choice) {
      e.target.value = '';
      return;
    }
    state = imported;
    if (!state.history) state.history = {};
    state.profiles.forEach(p => {
      if (!state.history[p.id]) state.history[p.id] = [];
    });
    saveState();
    showToast('インポートしました');
    // ホームへ
    currentProfileId = null;
    navStack = [];
    showScreen('profile-select', {}, true);
  } catch (err) {
    showAlert('インポート失敗', String(err.message || err));
  }
  e.target.value = '';
}

async function doReset() {
  const ok = await showConfirm('全データをリセット',
    '本当にすべてのデータ (問題・単元・履歴) を削除し、サンプルデータに戻しますか?\nこの操作は取り消せません。',
    { okText: 'リセット', danger: true });
  if (!ok) return;
  // 念のためダブルチェック
  const ok2 = await showConfirm('最終確認', '本当によろしいですか?', { okText: '実行', danger: true });
  if (!ok2) return;
  state = buildSampleData();
  saveState();
  currentProfileId = null;
  navStack = [];
  showToast('リセットしました');
  showScreen('profile-select', {}, true);
}

/* ------------------------------------------------------------
   起動
   ------------------------------------------------------------ */
loadState();
showScreen('profile-select', {}, true);
// 印刷後はプリントエリアをクリア (空にしておかないと次の印刷で前のが残る)
window.addEventListener('afterprint', () => {
  document.getElementById('print-area').innerHTML = '';
});

</script>
